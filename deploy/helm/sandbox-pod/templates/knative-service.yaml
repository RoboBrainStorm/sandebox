apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: model-{{ .Values.model.name }}
  namespace: {{ printf "ws-%s" (.Values.model.workspaceId | trunc 8) }}
  labels:
    app: rb-model-pod
    rb/model-name: {{ .Values.model.name | quote }}
    rb/workspace-id: {{ .Values.model.workspaceId | quote }}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: {{ .Values.knative.minScale | quote }}
        autoscaling.knative.dev/max-scale: {{ .Values.knative.maxScale | quote }}
    spec:
      runtimeClassName: {{ .Values.runtimeClassName | default "gvisor" | quote }}
      containers:
        - image: {{ .Values.model.imageTag | quote }}
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_CONFIG
              value: {{ .Values.model.configPath | quote }}
            - name: MAX_CONCURRENT_RUNS
              value: {{ .Values.runtime.maxConcurrentRuns | quote }}
            - name: RUN_TIMEOUT_SECONDS
              value: {{ .Values.runtime.timeoutSeconds | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
