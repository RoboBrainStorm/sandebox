[project]
name = "sandebox-cli"
version = "0.1.0"
description = "Command-line interface for sandebox cluster validation and workload execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sandebox-core",
    "sandebox",
]

[project.scripts]
sandebox = "sandebox_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandebox_cli"]
